# Copy to config.toml and edit. CLI flags override these values.

[transcribe]
language = "auto"            # "auto" (detect) | ISO 639-3 code (eng, zho, jpn, ...) or name
tag_audio_events = true      # 标记音频事件 (script default ON)
include_subtitles = true     # 包含字幕 (script default ON; web default is OFF)
no_verbatim = false          # 无逐字记录
use_speaker_library = false  # 从声音库分配声音
vocab = []                   # key terms, e.g. ["Maj3r", "V社"]
export_format = "srt"        # srt | vtt | txt | json | html | pdf | docx
poll_timeout_secs = 600      # max seconds to wait for transcription
# show_cost = false          # print estimated credit cost before upload
max_concurrency = 4          # 跨账号并发转录上限；1 = 回退串行
stagger_secs = 2.0           # 相邻上传起始的最小间隔（秒），降低同 IP 突发；0 = 关闭错峰

# Multi-account pool & auto-registration. Leave commented to use a single
# `stt login`-imported account (graceful single-account mode).

[temp_email]
base_url = "https://mail.example.com"   # your cloudflare_temp_email backend
admin_password = ""                      # x-admin-auth; preferred path (bypasses gates)
site_password = ""                       # x-custom-auth, only if /open_api/settings needAuth
domain = "example.com"                   # a domain from /open_api/settings domains[]
domains = ["example.com"]                # all usable domains; webui 域名下拉候选
use_admin_path = true                    # /admin/new_address vs /api/new_address
poll_interval_secs = 3
poll_timeout_secs = 120

[accounts]
pool_target = 3                          # keep this many fresh (full-quota) accounts
fresh_threshold = 10000                  # remaining >= this counts as "fresh"
selection_margin = 1.2                   # require remaining >= cost * margin
auto_refill = true                       # refill pool to target after each transcription

[register]
strategy = "camoufox"                    # camoufox (stealth Firefox + selectors, recommended; needs `pip install camoufox` + `python -m camoufox fetch`) | ui (legacy real-Chrome coordinates) | http (not implemented)
headless = false                         # camoufox only; false = visible window (better stealth + watchable)

[proxy]
# Upstream proxies for the registration flow (Chrome + Firebase/ElevenLabs httpx
# share one). MUST be residential / rotating IPs — ElevenLabs allows one free
# account per IP and hCaptcha flags datacenter ASNs. Empty = direct (default).
#
# The ui strategy drives real Chrome, whose --proxy-server does NOT accept inline
# user:pass credentials (it would pop an auth dialog the automation can't
# dismiss) — use IP-whitelisted proxies with the ui strategy. socks5:// also
# needs `pip install "httpx[socks]"` for the API calls (Chrome supports it natively).
# proxies = ["http://1.2.3.4:8080"]
proxies = []
fail_threshold = 3                       # disable a proxy after this many consecutive failures
cooldown_secs = 900                      # re-admit a disabled proxy after this long (15 min)
strict = false                           # true: error when all disabled; false: fall back to direct

[captcha]
# Only used by the http/cdp strategies (not implemented yet); the ui strategy
# gets hCaptcha's invisible pass and needs no solver.
provider = ""                            # ezcaptcha | 2captcha | yescaptcha
api_key = ""
